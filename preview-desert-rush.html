<!doctype html><html lang="es"><meta charset="utf-8"><title>Desert Rush — Preview</title><style>body{margin:0;background:#10171d;color:#f7c52e;font:16px system-ui;padding:24px}main{width:min(900px,100%);margin:auto}.card{background:#18252d;border:1px solid #725b18;border-radius:14px;padding:16px}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#d9ca9a;border-radius:8px}button{margin-top:12px;background:#f7b41e;color:#111;border:0;border-radius:8px;padding:10px 18px;font-weight:800;cursor:pointer}.muted{color:#b9aa7c}</style><main><h1>DESERT RUSH — PREVIEW</h1><div class="card"><canvas id="game" width="800" height="240"></canvas><button id="start">Iniciar / reiniciar</button><p class="muted">Mantén espacio, flecha arriba o el toque para saltar. Flecha abajo/Shift acelera la caída.</p></div></main><script>
const cv=document.querySelector('#game'),c=cv.getContext('2d');c.imageSmoothingEnabled=false;let run=false,last=0,dist=0,speed=5,y=164,vy=0,obs=[],coins=0,totems=0,biome=0,held=false,next=300;
const stages=[['Desierto','#d9ca9a'],['Templo','#d9ca9a'],['Aldea','#d9ca9a'],['Desierto rojo','#b5541c'],['Mesetas','#ad7652'],['Mineshaft','#342923']];
function reset(){run=true;dist=0;speed=5;y=164;vy=0;obs=[];coins=0;totems=0;biome=0;next=300}
function jump(){if(!run){reset();return}if(y>=164){vy=-13;held=true}}
function add(){const type=biome===5?'minecart':biome===4?'cliff':biome===3?'parched':biome===2?'camel':biome===1?'husk':'cactus';obs.push({x:820,type,w:type==='camel'?48:24,h:type==='cliff'?18:24,flower:type==='cactus'&&Math.random()<.18});if(Math.random()<.25&&coins<25)obs.push({x:940,type:'coin',w:16,h:16})}
function update(dt){if(!run)return;const nextBiome=stages.findLastIndex(x=>dist>=([0,7000,14000,21000,30000,42000][stages.indexOf(x)]));if(nextBiome!==biome)biome=Math.max(0,nextBiome);speed=biome<5?Math.min(12,5+dist/6000):Math.min(40,12+Math.log1p(dist-42000)/2.5);dist+=speed*dt;vy+=(held&&vy<0?0.45:1)*dt;y=Math.min(164,y+vy*dt);if(y>=164)vy=0;next-=speed*dt;if(next<=0){add();next=speed*42+100+Math.random()*180}obs.forEach(o=>o.x-=speed*dt);obs=obs.filter(o=>o.x>-80);if(held&&y<164)vy-=.2*dt}
function draw(){const [name,bg]=stages[biome];c.fillStyle=bg;c.fillRect(0,0,800,240);c.fillStyle=biome>=4?'#6d5142':'#b99362';c.fillRect(0,200,800,40);c.fillStyle='#f7c52e';c.font='bold 16px system-ui';c.fillText(name,20,28);c.fillStyle='#fff';c.fillText('DIST '+Math.floor(dist/10),650,28);c.fillStyle='#2b2118';c.fillRect(0,198,800,3);obs.forEach(o=>{if(o.type==='coin'){c.fillStyle='#f7c52e';c.fillRect(o.x,130,16,16);return}c.fillStyle=o.type==='cactus'?'#3f9b2a':o.type==='camel'?'#c99b61':o.type==='cliff'?'#17151a':o.type==='minecart'?'#666':'#8b6b4b';c.fillRect(o.x,200-o.h,o.w,o.h);if(o.flower){c.fillStyle='#ff9bb2';c.fillRect(o.x+6,175,12,8)}});c.fillStyle='#172027';c.fillRect(60,y,36,36);c.fillStyle='#f7c52e';c.fillRect(68,y+8,20,8);if(!run){c.fillStyle='#fff';c.fillText('Pulsa iniciar o espacio',320,110)}requestAnimationFrame(loop)}function loop(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw()}start.onclick=reset;addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code)){e.preventDefault();jump()}if(['ArrowDown','ShiftLeft','ShiftRight'].includes(e.code)&&run)vy+=3});addEventListener('keyup',e=>{if(['Space','ArrowUp'].includes(e.code))held=false});cv.addEventListener('pointerdown',e=>{e.preventDefault();jump()});cv.addEventListener('pointerup',()=>held=false);requestAnimationFrame(loop);
</script></html>
